name: Build Windows Installer

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Compile application
        run: javac -d out src/digitalwatch4/DigitalWatch4.java

      - name: Create executable JAR
        run: jar --create --file DigitalWatch4.jar --main-class digitalwatch4.DigitalWatch4 -C out .

      - name: Copy JAR into input folder
        run: Copy-Item -Path "DigitalWatch4.jar" -Destination "out/DigitalWatch4.jar"

      - name: Create Windows installer
        run: >
          jpackage
          --name "Digital Watch"
          --app-version "1.0.0"
          --vendor "Digital Watch"
          --input out
          --main-jar DigitalWatch4.jar
          --main-class digitalwatch4.DigitalWatch4
          --type msi
          --dest installer

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Digital-Watch-Windows-Installer
          path: installer/*.msi
